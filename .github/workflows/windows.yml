name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test the core library
        run: dotnet test tests/TermOrganize.Core.Tests/TermOrganize.Core.Tests.csproj -c Release --nologo

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Create a CI signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Term Organize" -KeyUsage DigitalSignature -FriendlyName "Term Organize CI" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "termorganize" -Force -AsPlainText
          New-Item -ItemType Directory -Force -Path src/TermOrganize.App, artifacts/msix | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath src/TermOrganize.App/TermOrganize.pfx -Password $password

      - name: Package MSIX
        run: >
          dotnet publish src/TermOrganize.App/TermOrganize.App.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:WindowsPackageType=MSIX
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile=TermOrganize.pfx
          -p:PackageCertificatePassword=termorganize
          -p:AppxBundle=Never
          -p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/

      - name: Clean project outputs before the unpackaged publish
        shell: pwsh
        run: |
          git clean -xdf src
          if (Test-Path .msbuild) { Remove-Item -Recurse -Force .msbuild }

      - name: Publish unpackaged app
        run: >
          dotnet publish src/TermOrganize.App/TermOrganize.App.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsAppSdkBootstrapInitialize=false
          -p:WindowsPackageType=None
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=false
          -p:EnableMsixTooling=true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -p:DisableEmbeddedXbf=false
          -o artifacts/unpackaged

      - name: Zip the unpackaged build
        shell: pwsh
        run: Compress-Archive -Path artifacts/unpackaged/* -DestinationPath artifacts/TermOrganize-win-x64.zip -Force

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: term-organize-windows
          path: |
            artifacts/TermOrganize-win-x64.zip
            artifacts/msix/**/*.msix
          if-no-files-found: error

      - name: Capture UI sweep screenshots
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $out = Join-Path $root "artifacts/ui-sweep"
          $unpackaged = Join-Path $root "artifacts/unpackaged"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function Show-SweepDiagnostics {
            Write-Host "--- ui-sweep directory ---"
            Get-ChildItem $out -Force | Format-Table Name, Length, LastWriteTime -AutoSize | Out-String | Write-Host
            foreach ($logName in 'error.txt','sweep.log','stdout.txt','stderr.txt') {
              $log = Join-Path $out $logName
              Write-Host "--- $logName ---"
              if (Test-Path $log) { Get-Content $log -Raw -ErrorAction SilentlyContinue | Write-Host }
              else { Write-Host "(missing)" }
            }
            Write-Host "--- Application event log (TermOrganize) ---"
            try {
              $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-2) } -ErrorAction SilentlyContinue |
                Where-Object { $_.Message -match 'TermOrganize' -or $_.ProviderName -match 'TermOrganize' } |
                Select-Object -First 40)
              if ($events.Count -eq 0) { Write-Host "(no matching Application events)" }
              foreach ($event in $events) {
                Write-Host ("[{0:u}] {1} id={2} {3}" -f $event.TimeCreated, $event.ProviderName, $event.Id, $event.LevelDisplayName)
                Write-Host $event.Message
              }
            } catch {
              Write-Host "event log: $($_.Exception.Message)"
            }
          }

          $runtime = Get-ChildItem -Path $unpackaged -Recurse -Filter Microsoft.WindowsAppRuntime.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          $priPath = @('resources.pri', 'TermOrganize.App.pri') |
            ForEach-Object { Join-Path $unpackaged $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $runtime -or -not $priPath) {
            Write-Host "--- unpackaged directory ---"
            Get-ChildItem $unpackaged -Force | Format-Table Name, Length -AutoSize | Out-String | Write-Host
            $missing = @()
            if (-not $runtime) { $missing += "Microsoft.WindowsAppRuntime.dll (WindowsAppSDKSelfContained=true)" }
            if (-not $priPath) { $missing += "resources.pri or TermOrganize.App.pri" }
            ($missing -join [Environment]::NewLine) | Set-Content -Path (Join-Path $out "error.txt")
            Show-SweepDiagnostics
            throw "Unpackaged publish is missing: $($missing -join '; ')"
          }

          $dump = Join-Path $out "pri-dump.xml"
          $probe = @($env:NUGET_PACKAGES, "$env:USERPROFILE\.nuget\packages", "${env:ProgramFiles(x86)}\Windows Kits\10\bin") | Where-Object { $_ -and (Test-Path $_) }
          $makepriCandidates = @(Get-ChildItem -Path $probe -Recurse -Filter makepri.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' })
          $makepri = $makepriCandidates | Where-Object { $_.FullName -match 'windows.sdk.buildtools' } | Select-Object -Last 1
          if (-not $makepri) { $makepri = $makepriCandidates | Select-Object -Last 1 }
          if (-not $makepri) {
            "makepri.exe was not found." | Set-Content -Path (Join-Path $out "error.txt")
            Show-SweepDiagnostics
            throw "makepri.exe was not found."
          }
          Write-Host "makepri $($makepri.FullName) dump $priPath ($((Get-Item $priPath).Length) bytes)"
          & $makepri.FullName dump /if $priPath /of $dump /dt Detailed
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dump)) {
            & $makepri.FullName dump /if $priPath /of $dump
          }
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dump)) {
            "makepri dump failed with exit $LASTEXITCODE." | Set-Content -Path (Join-Path $out "error.txt")
            Show-SweepDiagnostics
            throw "makepri dump failed with exit $LASTEXITCODE."
          }
          Write-Host "--- makepri dump ---"
          Get-Content $dump | Write-Host
          $dumpText = Get-Content $dump -Raw
          $loose = @(Get-ChildItem -Path $unpackaged -Recurse -File -Filter *.xbf -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'App.xbf' -or $_.Name -eq 'MainWindow.xbf' })
          Write-Host "--- compiled XAML ---"
          if ($loose) { $loose | Format-Table FullName, Length -AutoSize | Out-String | Write-Host } else { Write-Host "(no App.xbf or MainWindow.xbf)" }
          $names = @($loose | ForEach-Object Name)
          $indexed = $dumpText -match 'MainWindow' -and $dumpText -match 'App\.(xaml|xbf)'
          $embedded = $dumpText -match 'EmbeddedData'
          Write-Host "PRI bytes=$((Get-Item $priPath).Length) indexed=$indexed embeddedData=$embedded loose=$($names -join ',')"
          if (-not $indexed -or $names -notcontains 'App.xbf' -or $names -notcontains 'MainWindow.xbf') {
            $reason = "PRI $([IO.Path]::GetFileName($priPath)) is missing compiled MainWindow and App XAML (indexed=$indexed, embeddedData=$embedded, loose=$($names -join ','))."
            $reason | Set-Content -Path (Join-Path $out "error.txt")
            Show-SweepDiagnostics
            throw $reason
          }

          $exe = Join-Path $unpackaged "TermOrganize.App.exe"
          if (-not (Test-Path $exe)) {
            "Missing $exe" | Set-Content -Path (Join-Path $out "error.txt")
            Show-SweepDiagnostics
            throw "Missing $exe"
          }
          $stdout = Join-Path $out "stdout.txt"
          $stderr = Join-Path $out "stderr.txt"
          # A GUI-subsystem WinExe returns from `& $exe` before the process exits, and -Wait has no timeout.
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshot-sweep',"`"$out`"" -PassThru -WorkingDirectory $unpackaged -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $timedOut = $false
          try {
            Wait-Process -Id $p.Id -Timeout 420 -ErrorAction Stop
          } catch {
            $timedOut = $true
          }
          if (-not $p.HasExited) {
            $timedOut = $true
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit(10000) | Out-Null
          }
          $p.Refresh()
          $exit = $null
          if ($p.HasExited) { $exit = $p.ExitCode }
          $pngs = @(Get-ChildItem $out -Filter *.png -ErrorAction SilentlyContinue)
          if ($timedOut -or $null -eq $exit -or $exit -ne 0 -or $pngs.Count -lt 60) {
            Show-SweepDiagnostics
            if ($timedOut) { throw "UI sweep timed out after 420 seconds (exit $exit, $($pngs.Count) screenshots)." }
            if ($null -eq $exit -or $exit -ne 0) { throw "UI sweep exit code $exit; wrote $($pngs.Count) screenshots; expected at least 60." }
            throw "UI sweep wrote $($pngs.Count) screenshots; expected at least 60."
          }
          Write-Host "UI sweep wrote $($pngs.Count) screenshots, exit $exit."

      - name: Upload UI sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-sweep
          path: artifacts/ui-sweep/
          if-no-files-found: warn
